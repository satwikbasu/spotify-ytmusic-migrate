<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px system-ui, sans-serif; width: 300px; padding: 14px; }
      button { width: 100%; padding: 10px; font-size: 14px; cursor: pointer; }
      input { width: 100%; box-sizing: border-box; padding: 6px; margin: 6px 0; }
      #status { margin-top: 10px; white-space: pre-wrap; color: #333; }
      .ok { color: #15803d; } .err { color: #b3261e; }
      label { font-size: 12px; color: #666; }
    </style>
  </head>
  <body>
    <label for="token">Pairing token (from the app window)</label>
    <input id="token" placeholder="paste token here" />
    <button id="connect">Connect YouTube Music</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
